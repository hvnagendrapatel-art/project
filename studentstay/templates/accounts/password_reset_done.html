{% extends "base.html" %}
{% block title %}Check your email | StayFinder{% endblock %}
{% block content %}
<section class="owner-auth-section">
  <div class="owner-auth-card">
    <a class="auth-brand" href="{% url 'home' %}">StayFinder</a>
    <p class="auth-kicker">Reset email sent</p>
    <h1>Check your inbox</h1>
    <p class="owner-auth-intro">If an account with that email exists, we've sent instructions to reset your password.</p>
    <p class="auth-switch"><a href="{% url 'login' %}">Back to login</a></p>
  </div>
</section>
{% endblock %}
